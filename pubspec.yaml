name: grocery_price_app
description: Shopping list with approximate bill total, prices fetched from a local backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2       # state management
  sqflite: ^2.3.3        # local database (shopping list persists on-device)
  path: ^1.9.0
  http: ^1.2.1           # calls the pricing backend
  intl: ^0.19.0          # currency formatting (Rs. 1,450.00 style)
  shared_preferences: ^2.2.3  # persists your theme choice on-device

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
